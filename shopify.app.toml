# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "64b50aa7971e5f157ad668b4f902b93b"
name = "Custom Form Builder"
application_url = "https://localhost:3000"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_files,write_products"

[auth]
redirect_urls = [
  "https://localhost:3000/auth/callback",
  "https://localhost:3000/auth/shopify/callback",
  "https://localhost:3000/api/auth/callback"
]

[app_proxy]
url = "https://localhost:3000"
subpath = "custom-form-builder"
prefix = "apps"
